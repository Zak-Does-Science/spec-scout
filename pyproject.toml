[project]
name = "spec-scout"
version = "0.1.0"
description = "Turn a project's requirements list into a shortlist of compliant models and a priced cost sheet, with screenshot evidence for procurement."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zak Carroll" }]
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
web = ["playwright>=1.40"]

[project.scripts]
spec-scout = "specscout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["specscout"]
